[package]
name = "larp-jv-desktop"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
description = "Desktop frontend for larp.jv"
repository = "https://github.com/larpjav/larp.jv"

[dependencies]
larp-jv-core = { path = "../larp-jv-core" }
tokio = { workspace = true, features = ["full", "rt-multi-thread"] }
async-trait = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
parking_lot = { workspace = true }
dashmap = { workspace = true }
once_cell = { workspace = true }
crossbeam = { workspace = true }
arc-swap = { workspace = true }
log = { workspace = true }
tracing = { workspace = true, features = ["log"] }
tracing-subscriber = { workspace = true, features = ["json", "env-filter"] }
egui = { workspace = true, features = ["wgpu", "accesskit"] }
egui_wgpu = { workspace = true }
egui_winit = { workspace = true }
wgpu = { workspace = true, features = ["wgpu-hal"] }
wgpu-hal = { workspace = true, features = ["vulkan", "dx12", "metal", "gles"] }
winit = { workspace = true, features = ["raw-window-handle-06"] }
raw-window-handle = { workspace = true }
softbuffer = { workspace = true }
rfd = { version = "0.14", features = ["async"] }
arboard = "3.4"
notify-rust = "4.10"
tray-icon = { version = "0.16", features = ["winit"] }
uuid = { workspace = true, features = ["serde", "v4", "v7"] }
chrono = { workspace = true, features = ["serde", "tz", "clock"] }

[target.'cfg(target_os = "linux")'.dependencies]
notify-rust = "4.10"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = ["Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_Foundation"] }

[target.'cfg(target_os = "macos")'.dependencies]
obj = "0.14"
cocoa = "0.25"
core-foundation = "0.9"

[features]
default = []
