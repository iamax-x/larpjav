[package]
name = "larp-jv-android"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
description = "Android frontend for larp.jv"
repository = "https://github.com/larpjav/larp.jv"

[dependencies]
larp-jv-core = { path = "../larp-jv-core" }
tokio = { workspace = true, features = ["full", "rt-multi-thread"] }
async-trait = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
parking_lot = { workspace = true }
dashmap = { workspace = true }
once_cell = { workspace = true }
crossbeam = { workspace = true }
arc-swap = { workspace = true }
jni = { workspace = true, features = ["strings", "jni-7"] }
ndk = { workspace = true, features = ["api-24", "log", "native-activity", "asset", "looper"] }
ndk-sys = { workspace = true, features = ["api-24"] }
ndk-glue = { workspace = true }
android-activity = { workspace = true, features = ["native-activity"] }
android-assets = { workspace = true }
android_logger = { workspace = true }
log = { workspace = true }
tracing = { workspace = true, features = ["log"] }
tracing-subscriber = { workspace = true, features = ["json", "env-filter"] }
libc = { workspace = true }
egui = { workspace = true, features = ["wgpu", "accesskit"] }
egui_wgpu = { workspace = true }
egui_winit = { workspace = true }
wgpu = { workspace = true, features = ["wgpu-hal"] }
wgpu-hal = { workspace = true, features = ["vulkan", "gles"] }
winit = { workspace = true, features = ["raw-window-handle-06"] }
raw-window-handle = { workspace = true }
softbuffer = { workspace = true }
uuid = { workspace = true, features = ["serde", "v4", "v7"] }
chrono = { workspace = true, features = ["serde", "tz", "clock"] }

[target.'cfg(target_os = "android")'.dependencies]
ndk-glue = { workspace = true }

[features]
default = []
wgpu = ["egui/wgpu"]
